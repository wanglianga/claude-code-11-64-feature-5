services:
  postgres:
    image: postgres:18-alpine
    container_name: drainage-postgres
    environment:
      POSTGRES_DB: ccdev
      POSTGRES_USER: ccdev
      POSTGRES_PASSWORD: ccdev
    ports:
      - "5432:5432"
    volumes:
      - drainage_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ccdev -d ccdev"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
    container_name: drainage-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ccdev
      DB_USER: ccdev
      DB_PASSWORD: ccdev
      BOOTSTRAP_ENABLED: "true"
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
    container_name: drainage-frontend
    depends_on:
      - backend
    ports:
      - "8090:80"

volumes:
  drainage_pgdata:
