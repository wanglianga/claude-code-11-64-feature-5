server:
  port: 8080

spring:
  application:
    name: drainage-census
  datasource:
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${DB_NAME:ccdev}
    username: ${DB_USER:ccdev}
    password: ${DB_PASSWORD:ccdev}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 8

app:
  bootstrap:
    enabled: ${BOOTSTRAP_ENABLED:true}

logging:
  level:
    com.ccdev.drainage: INFO
